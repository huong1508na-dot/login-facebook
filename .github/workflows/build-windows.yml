name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "requirements.txt"
      - "build_exe.bat"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Validate Python
        run: python -m py_compile main.py

      - name: Source self-test
        shell: pwsh
        run: |
          python main.py --self-test
          python main.py --chrome-self-test

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --name FacebookCookieLogin --collect-all customtkinter main.py

      - name: Packaged EXE self-test
        shell: pwsh
        run: |
          $p1 = Start-Process -FilePath ".\dist\FacebookCookieLogin.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p1.ExitCode -ne 0) { throw "EXE parser self-test failed with exit code $($p1.ExitCode)" }

          $p2 = Start-Process -FilePath ".\dist\FacebookCookieLogin.exe" -ArgumentList "--chrome-self-test" -Wait -PassThru
          if ($p2.ExitCode -ne 0) { throw "EXE Chrome self-test failed with exit code $($p2.ExitCode)" }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: FacebookCookieLogin-Windows
          path: dist/FacebookCookieLogin.exe
          if-no-files-found: error
          retention-days: 14
