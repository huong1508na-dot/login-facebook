name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "requirements.txt"
      - "build_exe.bat"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Validate Python
        run: python -m py_compile main.py

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --name FacebookCookieLogin --collect-all customtkinter main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: FacebookCookieLogin-Windows
          path: dist/FacebookCookieLogin.exe
          if-no-files-found: error
          retention-days: 14
